services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: migrationpilot
      POSTGRES_USER: migrationpilot
      POSTGRES_PASSWORD: migrationpilot-local
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - migrationpilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U migrationpilot -d migrationpilot"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  migrationpilot_pgdata:
